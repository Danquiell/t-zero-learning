# Config final da Parte 4 (LunarLander-v3). O que mudou esta marcado com "era".

algorithm: ppo
env_id: LunarLander-v3
seed: 1
cuda: false
total_timesteps: 1000000
num_envs: 16            # era 4

track: true
capture_video: true
save_model: true
checkpoint_every: 0

network: DiscreteActorCritic
network_kwargs:
  activation: Tanh
  hidden_layers_size: 64

ppo:
  learning_rate: 2.5e-4
  anneal_lr: true
  num_steps: 256        # era 128
  gamma: 0.999          # era 0.99
  gae_lambda: 0.98      # era 0.95
  num_minibatches: 32   # era 4, minibatch continua 128
  update_epochs: 10     # era 4
  norm_adv: true
  clip_coef: 0.2
  clip_vloss: false     # era true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null
